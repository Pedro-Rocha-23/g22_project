{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white text-center fw-bold">
        <i class="bi bi-mortarboard-fill me-2"></i>G22 — Login
      </div>
      <div class="card-body p-4">
        <form method="post" action="/chklogin">
          <div class="mb-3">
            <label class="form-label fw-semibold">Utilizador</label>
            <input type="text" class="form-control" name="user" autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" class="form-control" name="password">
          </div>
          {% if resul %}
            <div class="alert alert-danger py-2 text-center">{{ resul }}</div>
          {% endif %}
          <div class="d-grid mt-3">
            <button type="submit" class="btn btn-primary">
              <i class="bi bi-box-arrow-in-right me-1"></i>Entrar
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
